name: Build ARM64 Images

on:
  workflow_dispatch:
  push:
    branches: [master, main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: muhtegaralfikri
  SOURCE_REPO: muhtegaralfikri/monitoring-bosowa-bandar

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deploy repo
        uses: actions/checkout@v4
        with:
          path: deploy

      - name: Checkout app repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          path: app

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: app
          file: deploy/backend.Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/monitoring-bosowa-bandar-api:latest
            ghcr.io/${{ env.OWNER }}/monitoring-bosowa-bandar-api:${{ github.sha }}

      - name: Build and push Web
        uses: docker/build-push-action@v6
        with:
          context: app
          file: deploy/frontend.Dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            VITE_API_URL=/api
          tags: |
            ghcr.io/${{ env.OWNER }}/monitoring-bosowa-bandar-web:latest
            ghcr.io/${{ env.OWNER }}/monitoring-bosowa-bandar-web:${{ github.sha }}

